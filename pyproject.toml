[project]
name = "urbantrace-mvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "paddleocr>=3.4.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "rapidocr-onnxruntime>=1.4.4",
    "react>=4.3.0",
    "ultralytics>=8.4.148",
]

[project.scripts]
urbantrace-mvp = "urbantrace_mvp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "opencv-python-headless>=5.0.0.93",
]
